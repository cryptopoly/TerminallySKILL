name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb libnss3 libxss1 libgtk-3-0 libgbm1 libasound2t64

      - run: npm ci

      - run: npm run test:ci

      - run: xvfb-run -a npm run test:e2e

      - run: REQUIRE_DOCKER_E2E=1 xvfb-run -a npm run test:e2e:ssh-docker

      - run: npm run test:audit:runtime

  # Same checks on the other two desktop platforms. Windows has never passed on GitHub's runners
  # (see docs/hub/backlog.md, Issues), so it reports without blocking the PR. Drop continue-on-error
  # once it passes.
  cross-platform:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:ci

      - run: npm run test:e2e

      - name: Keep e2e traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results
          retention-days: 7
