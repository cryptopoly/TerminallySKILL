name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb libnss3 libxss1 libgtk-3-0 libgbm1 libasound2t64

      - run: npm ci

      - run: npm run test:ci

      - run: xvfb-run -a npm run test:e2e

      - run: REQUIRE_DOCKER_E2E=1 xvfb-run -a npm run test:e2e:ssh-docker

      - run: npm run test:audit:runtime
