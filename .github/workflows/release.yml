name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run package:mac:${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

  build-linux:
    # Build each architecture on a runner of that architecture: node-pty has no Linux prebuilds, so
    # it is compiled on the build machine and an arm64 package built on x64 would ship an x86 pty.node.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and package
        run: npm run package:linux:${{ matrix.arch }}

      - name: Check the native terminal module matches the target architecture
        run: |
          pty=dist/linux-${{ matrix.arch == 'arm64' && 'arm64-' || '' }}unpacked/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node
          file "$pty"
          case "${{ matrix.arch }}" in
            arm64) file "$pty" | grep -q 'ARM aarch64' ;;
            x64) file "$pty" | grep -q 'x86-64' ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and package
        run: npm run package:win:${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: win-${{ matrix.arch }}
          path: |
            dist/*.exe

  release:
    needs: [build-mac, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate update feeds
        run: node scripts/generate-update-feeds.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: docs/releases/v${{ inputs.version }}.md
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Refresh draft release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ inputs.version }}" --repo "${{ github.repository }}" --title "v${{ inputs.version }}" --notes-file "docs/releases/v${{ inputs.version }}.md" --draft
