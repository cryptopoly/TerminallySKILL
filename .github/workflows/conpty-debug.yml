# TEMPORARY: measures quitting with terminals open on GitHub's Windows runners (the full verification is in bbf7bc2d). Lives on fix/conpty-dll-server only and
# is removed before the branch is finished.
name: conpty debug (temporary)

on:
  push:
    branches:
      - fix/conpty-dll-server
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Quit with terminals open, many times: the commit before "end conpty.dll terminals one at a time" and this one.
  quit-stress:
    name: quit stress (${{ matrix.os }}, ${{ matrix.code }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
        code: [before, after]
    env:
      RUN_CONPTY_QUIT_STRESS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 30

      - name: Take out "end conpty.dll terminals one at a time" (8c385156)
        if: matrix.code == 'before'
        shell: bash
        run: |
          git show 8c385156 -- src/main/pty-manager.ts | git apply -R
          git diff --stat

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Quit with 3 terminals open, 200 times
        run: npx playwright test tests/e2e/zz-conpty-quit-stress.spec.mjs --reporter=list --retries=0
        continue-on-error: true
        env:
          QUIT_STRESS_ROUNDS: "200"
          QUIT_STRESS_TERMINALS: "3"

      - name: Quit with 8 terminals open, 100 times
        run: npx playwright test tests/e2e/zz-conpty-quit-stress.spec.mjs --reporter=list --retries=0
        continue-on-error: true
        env:
          QUIT_STRESS_ROUNDS: "100"
          QUIT_STRESS_TERMINALS: "8"
