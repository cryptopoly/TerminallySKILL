# TEMPORARY: reproduces Windows conpty.dll problems on GitHub's runners. Lives on fix/conpty-dll-server
# only and is removed before the branch is finished.
name: conpty debug (temporary)

on:
  push:
    branches:
      - fix/conpty-dll-server
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # node-pty alone: several terminals killed back to back, as when the app quits.
  kill-stress:
    name: kill stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is cdb.exe on this machine?
        shell: pwsh
        run: Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | ForEach-Object FullName

      - name: node-pty as installed (files, then spawn, write, kill, spawn again)
        run: node .github/conpty-debug/probe.cjs

      - name: DLL, 3 terminals, 150 rounds
        run: node .github/conpty-debug/supervise.cjs dll 3 150
        continue-on-error: true

      - name: DLL, 8 terminals, 60 rounds
        run: node .github/conpty-debug/supervise.cjs dll 8 60
        continue-on-error: true

      - name: inbox, 3 terminals, 100 rounds
        run: node .github/conpty-debug/supervise.cjs inbox 3 100
        continue-on-error: true

      - name: inbox, 8 terminals, 40 rounds
        run: node .github/conpty-debug/supervise.cjs inbox 8 40
        continue-on-error: true

  # The app: quit with terminals open, many times, with the DLL and without.
  quit-stress:
    name: quit stress (${{ matrix.os }}, dll ${{ matrix.dll }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        dll: ["on", "off"]
        include:
          - os: windows-11-arm
            dll: "on"
    env:
      TSK_CONPTY_DLL: ${{ matrix.dll == 'off' && '0' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Quit with 3 terminals open, 100 times
        run: npx playwright test tests/e2e/zz-conpty-quit-stress.spec.mjs --reporter=list --retries=0
        continue-on-error: true
        env:
          RUN_CONPTY_QUIT_STRESS: "1"
          QUIT_STRESS_ROUNDS: "100"
          QUIT_STRESS_TERMINALS: "3"

      - name: The test that hung on windows-2022, 20 times
        run: npx playwright test tests/e2e/attention-schedule.spec.mjs -g "missed run is recorded" --repeat-each=20 --retries=0 --reporter=list
        continue-on-error: true

  # The normal checks, with the fix and nothing copied by hand.
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install setuptools

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:ci

      - run: npm run test:e2e

      - name: Keep e2e traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conpty-suite-${{ matrix.os }}
          path: test-results
          retention-days: 7
